<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Tasks</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="app">

    <div class="todo-container">

      <div class="todo-header">
        <h1>My Tasks</h1>

        <p id="task-count">0 tasks remaining</p>
      </div>

      <!-- Add Todo -->
      <form id="todo-form" class="todo-form">

        <input
          type="text"
          id="todo-input"
          placeholder="What needs to be done?"
          autocomplete="off"
        />

        <button type="submit">
          Add Task
        </button>

      </form>

      <!-- Controls -->
      <div class="todo-controls">

        <div class="filters">

          <button
            type="button"
            class="filter-btn active-filter"
            data-filter="all"
          >
            All
          </button>

          <button
            type="button"
            class="filter-btn"
            data-filter="active"
          >
            Active
          </button>

          <button
            type="button"
            class="filter-btn"
            data-filter="completed"
          >
            Completed
          </button>

        </div>

        <button
          type="button"
          id="clear-completed"
          class="clear-btn"
        >
          Clear completed
        </button>

      </div>

      <!-- Todo List -->
      <div id="todo-list" class="todo-list"></div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
